name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.filter.outputs.zig }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect changed paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            zig:
              - '**/*.zig'
              - 'build.zig.zon'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  lint-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-zig.yml@01ae1180108c78f09cb34eed8d9e97dacf2083a9
    with:
      zig-version: "0.16.0"

  build-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-zig.yml@01ae1180108c78f09cb34eed8d9e97dacf2083a9
    with:
      zig-version: "0.16.0"

  test-zig-system:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    env:
      WINEDLLOVERRIDES: "mscoree=d;mshtml=d"
      WINEDEBUG: "fixme-all"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build
        run: zig build

      - name: Install Wine and Xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 xvfb

      - name: Initialize Wine prefix
        run: xvfb-run -a wineboot --init

      - name: Run smoke test
        run: |
          rc=0
          timeout 5 xvfb-run -a wine zig-out/bin/hello-zigwin.exe || rc=$?
          [ "$rc" -eq 124 ]

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@01ae1180108c78f09cb34eed8d9e97dacf2083a9

  ci:
    if: always()
    needs: [lint-zig, build-zig, test-zig-system, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
